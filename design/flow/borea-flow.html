/* Fit to the available window. Extra content is paged, never clipped or scrolled. */
html,body{height:100%;overflow:hidden}
body{height:100dvh;padding:8px;gap:8px;justify-content:flex-start;min-height:0}
body>#scene{max-width:none;flex:none;min-height:0;container-type:size}

#preview-toolbar button,#preview-toolbar select,#demo-tools summary{font-size:12px;padding:5px 8px}
#demo-tools{position:relative}

#demo-tools>div{position:fixed;z-index:20;bottom:54px;right:12px;width:min(450px,calc(100vw - 48px));padding:12px;display:flex;gap:10px;flex-wrap:wrap;background:#111821;border:1px solid #33414f;border-radius:8px;box-shadow:0 8px 30px #0008}

/* Small inline icons keep the mockup independent of network/CDN availability. */
.ti{display:inline-block;font-style:normal;line-height:1}

 const {clone,toOriginal}=measurementCopy(panel);
 const measured=screenUnits(clone);
 if(!measured.units.length){measureUI.replaceChildren();pager.hidden=true;currentFit=null;return}
 const pages=[];let indices=[];
 for(let i=0;i<measured.units.length;i++){
  const test=[...indices,i];showUnits(measured,test);
  if(indices.length&&!fitsPanel(clone)){pages.push(indices);indices=[i];showUnits(measured,indices)}else indices=test;
 }
 if(indices.length)pages.push(indices);
 const data={units:measured.units.map(el=>toOriginal.get(el)),groups:measured.groups.map(el=>toOriginal.get(el))};
 let index=Math.min(fitIndices.get(page)||0,pages.length-1);
 const focused=data.units.findIndex(el=>el.contains(document.activeElement));
 if(focused>=0){const focusPage=pages.findIndex(items=>items.includes(focused));if(focusPage>=0)index=focusPage}
 // Only the final result touches live fields. They are never hidden to measure.
 currentFit={panel,data,pages,index,key:page};showFitPage(index,false);
 measureUI.replaceChildren();
}

function showFitPage(index,focus){
 const f=currentFit;if(!f)return;
 f.index=Math.max(0,Math.min(index,f.pages.length-1));fitIndices.set(f.key,f.index);
 showUnits(f.data,f.pages[f.index]);
 f.panel.scrollTop=0;f.panel.scrollLeft=0;
 f.panel.dataset.fitOverflow=String(!fitsPanel(f.panel));
 pager.hidden=f.pages.length<=1;
 const counter=document.getElementById('screen-count'),counterText=(f.index+1)+' / '+f.pages.length;if(counter.textContent!==counterText)counter.textContent=counterText;
 document.getElementById('screen-prev').disabled=f.index===0;
 document.getElementById('screen-next').disabled=f.index===f.pages.length-1;
 if(page==='net'){
  syncNetworkHeadings();
  const row=document.querySelector('#wifi .row.sel');HI.hidden=!row||!visibleNode(row);
  if(row&&visibleNode(row))moveHi(row,false);
 }
 if(focus){const control=f.data.units.filter(el=>!el.hasAttribute('data-fit-hidden')).flatMap(el=>[...(el.matches('button,input,select,[tabindex]')?[el]:[]),...el.querySelectorAll('button,input,select,[tabindex]')])[0];if(control)control.focus({preventScroll:true})}
}
function focusFitItem(el){
 const f=currentFit;
 if(f){const unit=f.data.units.findIndex(unit=>unit===el||unit.contains(el));if(unit>=0){const index=f.pages.findIndex(items=>items.includes(unit));if(index>=0)showFitPage(index,false)}}
 el.focus({preventScroll:true});
}
document.getElementById('screen-prev').onclick=()=>showFitPage(currentFit.index-1,false);
document.getElementById('screen-next').onclick=()=>showFitPage(currentFit.index+1,false);
const observer=new MutationObserver(records=>{
 const panel=currentPanel();if(!panel)return;
 const changed=records.some(record=>{
  if(!panel.contains(record.target))return false;
  if(record.type==='attributes')return record.target===panel||record.target.matches('.lv,#pw');
  return true;
 });
 if(changed)scheduleScreenFit();
});
observer.observe(ui,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['style','aria-expanded']});
window.addEventListener('resize',fitWindow);document.getElementById('mon').addEventListener('change',fitWindow);
const fitRun=run;run=function(){fitIndices.clear();currentFit=null;pager.hidden=true;fitRun();fitWindow()};document.getElementById('replay').onclick=run;
fitWindow();

</script>
</body></html>

name: c08 resolve fedora 45
on:
  push:
    branches: [scratch/c08-resolve-fedora45]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Fedora 45 keys and repo key paths
        run: |
          docker run --rm registry.fedoraproject.org/fedora@sha256:ea6d638d83c7bf2f4dd082e804c4a125feee764ba82e3e7798148673e445a496 sh -ec '
            rpm -ql fedora-repos | grep -E "\.repo$"
            rpm -ql fedora-gpg-keys | grep -E "fedora-45" 
            f=$(rpm -ql fedora-repos | grep -E "/fedora\.repo$")
            grep -E "^(gpgkey|gpgcheck|metalink)" "$f" | sort -u
            for k in $(rpm -ql fedora-gpg-keys | grep -E "fedora-45-(primary|x86_64)$"); do
              echo "== $k"; gpg --show-keys --with-fingerprint --keyid-format long "$k"
            done
          '

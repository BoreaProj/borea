name: c08 resolve fedora 45
on:
  push:
    branches: [scratch/c08-resolve-fedora45]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Fedora 45 keys and repo key paths
        run: |
          docker run --rm registry.fedoraproject.org/fedora@sha256:ea6d638d83c7bf2f4dd082e804c4a125feee764ba82e3e7798148673e445a496 sh -ec '
            ls -l /etc/pki/rpm-gpg/ | grep -i 4[456] || ls -l /etc/pki/rpm-gpg/
            grep -h "^gpgkey" /etc/yum.repos.d/*.repo | sort -u
            dnf5 -q -y install gnupg2 >/dev/null
            for k in $(ls /etc/pki/rpm-gpg/ | grep -E "fedora-45-(primary|x86_64)$"); do
              echo "== $k"; gpg --show-keys --with-fingerprint --keyid-format long "/etc/pki/rpm-gpg/$k"
            done
            dnf5 -q repoquery --releasever=45 --qf "%{name}-%{evr} %{repoid}\n" noctalia 2>/dev/null | sort -u
          '

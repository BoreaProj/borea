name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: test
        run: cargo test --workspace --all-features --locked

      # Matrix, recipe lint, golden plans and the secret canary are enabled by
      # cards A01, A05, A06 and A09. Until then this workflow only guards the
      # workspace. Do not add steps that cannot pass yet.

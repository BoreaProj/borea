name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: test
        run: cargo test --workspace --all-features --locked

      - name: matrix and recipes
        run: |
          cargo xtask matrix check
          cargo xtask recipe lint
          cargo xtask matrix render --check

      - name: golden plans and refusals
        run: cargo xtask plan golden

      - name: secret boundary canary
        run: cargo xtask secret canary

      - name: image and Omarchy preview fixtures
        run: |
          cargo xtask disk selftest --stage create
          cargo xtask e2e --profile omarchy-trim

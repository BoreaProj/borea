name: disposable-image-storage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, ext4]
        family: [arch, debian, fedora, suse]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Namespace prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Build and fetch pinned independent runtime
        run: |
          cargo build --release --locked -p borea-cli -p xtask
          target/release/borea runtime fetch --family '${{ matrix.family }}' --cache "$RUNNER_TEMP/borea-image-runtime"
      - name: Real disposable-image execution and repeat probes
        run: |
          mkdir -p target/image-validation
          set -o pipefail
          sudo env BOREA_RUNTIME_CACHE="$RUNNER_TEMP/borea-image-runtime" target/release/xtask disk selftest --fs '${{ matrix.fs }}' --family '${{ matrix.family }}' 2>&1 | tee 'target/image-validation/${{ matrix.fs }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-storage-${{ matrix.family }}-${{ matrix.fs }}
          path: target/image-validation

  bootstrap:
    needs: [storage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, ext4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Namespace prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap ovmf qemu-system-x86
      - name: Build and fetch pinned independent Arch runtime
        run: |
          cargo build --release --locked -p borea-cli -p xtask
          target/release/borea runtime fetch --family arch --cache "$RUNNER_TEMP/borea-image-runtime"
      - name: Real disposable-image Arch bootstrap and Limine bootloader
        run: |
          mkdir -p target/bootstrap-validation
          set -o pipefail
          out="$PWD/target/bootstrap-validation"
          fs='${{ matrix.fs }}'
          sudo env BOREA_RUNTIME_CACHE="$RUNNER_TEMP/borea-image-runtime" target/release/xtask disk bootstrap --fs "$fs" --out "$out/$fs.img" --plan-out "$out/$fs.verify-plan.json" 2>&1 | tee "$out/$fs.bootstrap.log"
      - name: QEMU boot and borea verify --ssh
        run: |
          set -o pipefail
          out="$PWD/target/bootstrap-validation"
          fs='${{ matrix.fs }}'
          sudo target/release/xtask vm boot --image "$out/$fs.img" --fs "$fs" --serial-log "$out/$fs.serial.log" --plan "$out/$fs.verify-plan.json" --report "$out/$fs.verify.json" 2>&1 | tee "$out/$fs.vm.log"
      - name: Corrupted root image must fail to boot
        run: |
          set -o pipefail
          out="$PWD/target/bootstrap-validation"
          fs='${{ matrix.fs }}'
          sudo target/release/xtask vm corrupt-root --image "$out/$fs.img" --out "$out/$fs.corrupt.img"
          sudo target/release/xtask vm boot --image "$out/$fs.corrupt.img" --fs "$fs" --serial-log "$out/$fs.corrupt.serial.log" --expect fail 2>&1 | tee "$out/$fs.corrupt.vm.log"
      - name: Remove disposable images
        if: always()
        run: sudo rm -f -- target/bootstrap-validation/*.img
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-bootstrap-arch-${{ matrix.fs }}
          path: |
            target/bootstrap-validation/*.log
            target/bootstrap-validation/*.json

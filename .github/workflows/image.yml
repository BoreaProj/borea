name: disposable-image-storage
on:
  push:
    branches: [main, feature/image-executor]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, ext4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Namespace prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Build and fetch pinned independent runtime
        run: |
          cargo build --release --locked -p borea-cli -p xtask
          target/release/borea runtime fetch --family arch --cache "$PWD/target/image-runtime"
      - name: Real disposable-image execution and repeat probes
        run: |
          mkdir -p target/image-validation
          set -o pipefail
          sudo env BOREA_RUNTIME_CACHE="$PWD/target/image-runtime" target/release/xtask disk selftest --fs '${{ matrix.fs }}' 2>&1 | tee 'target/image-validation/${{ matrix.fs }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-storage-${{ matrix.fs }}
          path: target/image-validation

# Test profile: Hyprland + Noctalia, greetd, no apps.
# `family` is overridden by `xtask e2e --family`.
schema = 2

[target]
family = "arch"
hostname = "borea-test"
timezone = "UTC"
locale = "en_US.UTF-8"
keymap = "us"

[disk]
device = "/dev/vda"
mode = "replace"
root_fs = "btrfs"
encrypt = false
esp_size = "1GiB"
boot_size = "2GiB"
swap = "zram"

[boot]
loader = "auto"
secure_boot = false

[account]
username = "tester"
full_name = "Borea Test"
password_file = "/run/borea/user.pass"
sudo = "same"
ssh_authorized_key_file = "/run/borea/test.pub"

[session]
type = "shell"
compositor = "hyprland"
shell = "noctalia"
greeter = "greetd"

[apps]
enable = []
codecs = true
flatpak = false
